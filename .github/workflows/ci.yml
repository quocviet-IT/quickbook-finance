name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: typecheck + test + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ctyhp-accounting
    env:
      # The app reads Supabase config at request time, never at build time, so
      # the build only needs syntactically valid placeholders. Never put real
      # keys here — CI must not be able to reach the production database.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ctyhp-accounting/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Source credential safety
        run: npm run security:check-source

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      # Last because it is the slowest gate; the three above fail faster.
      - name: Build
        run: npm run build

      - name: Bundle quality report
        id: bundle
        run: npm run quality:bundle
        env:
          QUALITY_MODE: report

      - name: Upload quality report
        # always() so the report still survives a gate failing after it, but
        # there is nothing to upload when the report step never ran — and
        # if-no-files-found below would then add a second red step that hides
        # which gate actually failed.
        if: always() && steps.bundle.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: quality-bundle-${{ github.sha }}
          path: ctyhp-accounting/.quality-results
          # The directory name starts with a dot, and upload-artifact excludes
          # hidden paths by default — without this the glob matches nothing and
          # the job fails on a report that was written correctly.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
