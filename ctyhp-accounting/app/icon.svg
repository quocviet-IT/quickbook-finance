<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The browser-tab mark, drawn to match .app-shell__brand-mark exactly: the
    solid brand teal (intent.primarySolid) behind white "1B", rounded the same
    way. The tab and the sidebar should read as the same object.

    The teal is the one colour deliberately written here rather than read from
    a token: an SVG served as a favicon runs outside the app's stylesheet, so
    there is no variable to read. If the brand teal ever changes in
    lib/design/palette.ts, this file changes with it.
  -->
  <rect width="32" height="32" rx="8" fill="#0f766e"/>
  <text x="16" y="21.5" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">1B</text>
</svg>
