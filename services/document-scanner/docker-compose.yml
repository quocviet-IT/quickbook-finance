# The whole scanner: ClamAV, and the gateway One Book talks to.
#
#   SCANNER_TOKEN=$(openssl rand -hex 24) docker compose up -d
#
# The gateway is published on 127.0.0.1 only. Put a reverse proxy in front of it
# for TLS — One Book refuses a DOCUMENT_SCANNER_URL that is neither https nor
# localhost, and it is right to. See README.md.

services:
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      # Update signatures on start and then hourly. A scanner running on last
      # month's database is a scanner that says "clean" about this month's
      # malware, which is worse than one that is honestly unavailable.
      CLAMAV_NO_FRESHCLAMD: "false"
      FRESHCLAM_CHECKS: "24"
    volumes:
      # Keep the signature database across restarts. Without this every restart
      # re-downloads ~250MB and the service is unusable until it finishes.
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      # The first signature download takes minutes on a cold volume; nothing
      # should be declared unhealthy while it is still arriving.
      start_period: 300s
    deploy:
      resources:
        limits:
          # clamd loads the whole signature set into memory. Below ~1.5GB it is
          # killed mid-scan, which the gateway correctly reports as an error —
          # so the symptom is "every scan fails", not "clamd is short of memory".
          memory: 2G

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    environment:
      SCANNER_TOKEN: ${SCANNER_TOKEN:?set SCANNER_TOKEN to at least 24 characters}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      PORT: "8080"
    ports:
      # Loopback only. Anything that terminates TLS goes in front of this.
      - "127.0.0.1:8080:8080"

volumes:
  clamav-db:
